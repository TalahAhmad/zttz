<style>
:root{
  /* default look — the pink one. themes below override these. */
  --bg:#FFF0F5; --tintA:#FFE1EC; --tintB:#FFE8F0;
  --card:#FFFBFC; --cardSolid:#FFFBFC;
  --ink:#5E2B45; --soft:#7B4A60; --accent:#F0709B; --onAccent:#FFFFFF;
  --deep:#C24C77; --hair:#F6C9DA; --hair2:#FBD3E1; --notch:#FFFBFC;
  --tabBg:rgba(255,255,255,.6); --tabInk:#C79AAC;
  --yayA:#FFE3EE; --yayB:#FFD2E2; --yayInk:#C24C77;
  --shadow:rgba(194,76,119,.45);

  /* legacy aliases */
  --blush:#FFF0F5; --rose:#F0709B; --plum:#5E2B45; --cream:#FFFBFC;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  min-height:100svh;
  background:
    radial-gradient(760px 480px at 82% -6%, var(--tintA), transparent 62%),
    radial-gradient(620px 520px at 6% 104%, var(--tintB), transparent 60%),
    var(--blush);
  color: var(--ink);
  font-family:"Karla", system-ui, sans-serif;
  font-size:15.5px; line-height:1.65;
  display:grid; place-items:center;
  padding:26px 18px 40px;
  -webkit-font-smoothing:antialiased;
  transition:background .45s ease, color .45s ease;
}
.shell{ width:min(560px,100%); }

/* tabs */
.tabs{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:14px; }
.tabs.hide{ display:none; }
.tab{
  font-family:"Karla",sans-serif; font-weight:700; font-size:13px; letter-spacing:.04em;
  padding:9px 18px; border-radius:999px; cursor:pointer;
  border:1px solid var(--hair); background:var(--tabBg); color:var(--tabInk); transition:.18s;
}
.tab:hover{ background:#fff; color:var(--accent); }
.tab.on{ background:var(--accent); border-color:var(--accent); color:var(--onAccent); }
.tab:focus-visible{ outline:2px solid var(--deep); outline-offset:3px; }
.tab .yes{ margin-left:6px; }

.card{
  background:var(--card);
  border:1px solid var(--hair2);
  border-radius:26px;
  padding:clamp(28px,6vw,46px);
  box-shadow:0 24px 60px -30px var(--shadow);
  transition:background .4s ease, border-color .4s ease;
  text-align:center;
}
.fade{ animation:fadein .35s ease-out; }
@keyframes fadein{ from{ opacity:0; transform:translateY(8px); } }

.eyebrow{ font-family:"Caveat", cursive; font-size:21px; color:var(--accent); margin-bottom:6px; }
h1{
  font-family:"Fraunces", Georgia, serif; font-weight:600;
  font-size:clamp(38px,9.5vw,58px); line-height:1.02;
  margin:0 0 16px; letter-spacing:-.02em; color:var(--deep);
}
.note{ margin:0 auto 26px; max-width:40ch; color:var(--soft); }

.rows{ text-align:left; border-top:1px dashed var(--hair); margin-bottom:28px; }
.row{ display:flex; gap:16px; align-items:baseline; padding:11px 2px; border-bottom:1px dashed var(--hair); }
.row .k{ font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); min-width:62px; font-weight:700; }
.row .v{ flex:1; }

.q{ font-family:"Fraunces", Georgia, serif; font-style:italic; font-size:clamp(21px,4.6vw,27px); line-height:1.25; margin:0 0 22px; }
.btns{ display:flex; gap:14px; justify-content:center; align-items:center; flex-wrap:wrap; }
.btn{
  font-family:"Karla",sans-serif; font-weight:700; font-size:16px;
  letter-spacing:.06em; padding:13px 34px; border-radius:999px; cursor:pointer;
  border:1px solid transparent; transition:transform .25s cubic-bezier(.2,.9,.3,1.4), box-shadow .2s, background .2s;
}
.btn:focus-visible{ outline:2px solid var(--deep); outline-offset:3px; }
#yes{ background:var(--accent); color:var(--onAccent); box-shadow:0 10px 24px -12px var(--shadow); }
#yes:hover{ background:var(--deep); }
.slot{ min-width:120px; min-height:48px; display:grid; place-items:center; }
#no{ background:var(--cardSolid); color:var(--soft); border-color:var(--hair); z-index:50; }
.taunt{ font-family:"Caveat",cursive; font-size:20px; color:var(--accent); min-height:1.5em; margin-top:16px; }

.settled{ font-family:"Caveat",cursive; font-size:26px; color:var(--ink); }

/* ── photo ── */
.polaroid{ display:inline-block; background:#FFFDFB; padding:11px 11px 0;
  border:1px solid rgba(0,0,0,.07); border-radius:3px; margin:2px 0 24px;
  transform:rotate(-2.2deg); box-shadow:0 14px 32px -18px rgba(0,0,0,.45);
  transition:transform .3s ease; max-width:min(300px,80%); }
.polaroid:hover{ transform:rotate(0deg) scale(1.02); }
.polaroid img{ display:block; width:100%; height:auto; }
.polaroid .cap{ font-family:"Caveat",cursive; font-size:19px; color:#6B5A4A;
  padding:7px 2px 11px; line-height:1.2; }

/* ── coupon ── */
.coupon{ position:relative; display:flex; text-align:left; margin:4px 0 26px;
  border:2px dashed var(--accent); border-radius:14px; overflow:hidden; background:var(--cpnBg,var(--cardSolid)); }
.coupon::before, .coupon::after{ content:""; position:absolute; width:20px; height:20px;
  border-radius:50%; background:var(--notch); left:calc(72% - 10px); }
.coupon::before{ top:-11px; } .coupon::after{ bottom:-11px; }
.cpn-main{ flex:1 1 72%; padding:18px 20px; }
.cpn-label{ font-size:9.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); font-weight:700; }
.cpn-title{ font-family:"Fraunces",Georgia,serif; font-size:clamp(24px,5.4vw,32px);
  line-height:1.05; color:var(--ink); margin:6px 0 7px; }
.cpn-terms{ font-size:12.5px; line-height:1.55; color:var(--soft); margin-bottom:14px; }
.cpn-btn{ font-family:"Karla",sans-serif; font-weight:700; font-size:13px; letter-spacing:.08em;
  background:var(--accent); color:var(--onAccent); border:none; border-radius:999px; padding:9px 24px; cursor:pointer; transition:.18s; }
.cpn-btn:hover{ background:var(--deep); }
.cpn-btn:focus-visible{ outline:2px solid var(--deep); outline-offset:3px; }
.cpn-stub{ flex:0 0 28%; border-left:2px dashed var(--accent); display:grid; place-content:center;
  gap:7px; text-align:center; padding:12px 6px; }
.cpn-code{ font-family:"Caveat",cursive; font-size:27px; color:var(--ink); line-height:1; letter-spacing:2px; }
.cpn-exp{ font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--soft); }
.coupon.used .cpn-main, .coupon.used .cpn-stub{ opacity:.42; }
.stamp{ position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; }
.stamp span{ font-family:"Karla",sans-serif; font-weight:700; font-size:clamp(17px,4vw,22px);
  letter-spacing:.12em; color:var(--ink); border:3px solid var(--ink); border-radius:8px;
  padding:6px 16px; transform:rotate(-11deg); background:var(--cpnBg,var(--cardSolid));
  animation:thud .4s cubic-bezier(.2,1.6,.4,1); }
@keyframes thud{ 0%{ transform:rotate(-11deg) scale(2.4); opacity:0; }
  70%{ transform:rotate(-11deg) scale(.92); } 100%{ transform:rotate(-11deg) scale(1); } }

.heart{ margin:30px auto 0; display:block; width:min(200px,60%); height:auto; }

/* yay */
.yay{ position:fixed; inset:0; z-index:200; display:none; place-items:center; text-align:center; padding:24px;
  background:radial-gradient(700px 520px at 50% 38%, var(--yayA), var(--yayB) 78%); }
.yay.on{ display:grid; animation:fade .35s ease-out; }
@keyframes fade{ from{ opacity:0; } }
#pop{ position:absolute; inset:0; width:100%; height:100%; }
.yay .in{ position:relative; z-index:2; }
.yay h2{
  font-family:"Fraunces",Georgia,serif; font-weight:600; font-style:italic;
  font-size:clamp(84px,26vw,190px); line-height:.9; margin:0; color:var(--yayInk);
  text-shadow:0 8px 30px rgba(0,0,0,.14); animation:boing .7s cubic-bezier(.2,1.5,.4,1);
}
@keyframes boing{ 0%{ transform:scale(.3); opacity:0; } 60%{ transform:scale(1.12); } 100%{ transform:scale(1); } }
.yay p{ font-family:"Caveat",cursive; font-size:26px; color:var(--yayInk); margin:6px 0 22px; }
.pick{ font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--yayInk); opacity:.75; margin-bottom:10px; }
.days{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.day{ font-family:"Karla",sans-serif; font-weight:700; font-size:14px; padding:9px 16px; border-radius:999px;
  border:1px solid var(--yayInk); background:rgba(255,255,255,.7); color:var(--yayInk); cursor:pointer; transition:.18s; }
.day:hover{ background:#fff; transform:translateY(-2px); }
.day.on{ background:var(--yayInk); color:#fff; border-color:var(--yayInk); }
.locked{ font-family:"Caveat",cursive; font-size:24px; color:var(--yayInk); min-height:1.4em; margin-top:14px; }
.close{ margin-top:26px; font-family:"Karla",sans-serif; font-weight:700; font-size:13px; letter-spacing:.06em;
  background:none; border:1px solid var(--yayInk); color:var(--yayInk); padding:9px 20px; border-radius:999px; cursor:pointer; }
.close:hover{ background:var(--yayInk); color:#fff; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>

<div class="shell">
  <nav class="tabs" id="tabs"></nav>

  <main class="card" id="card"></main>

  <svg class="heart" viewBox="0 0 240 200" aria-label="a heart with an arrow through it" role="img">
    <line x1="14" y1="152" x2="226" y2="48" stroke="var(--deep)" stroke-width="5" stroke-linecap="round"/>
    <path d="M120 176 C 42 120, 20 74, 50 46 C 74 24, 105 31, 120 55 C 135 31, 166 24, 190 46 C 220 74, 198 120, 120 176 Z"
          fill="var(--accent)" stroke="var(--deep)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M226 48 L 206 44 L 212 62 Z" fill="var(--deep)"/>
    <g stroke="var(--deep)" stroke-width="4" stroke-linecap="round">
      <line x1="16" y1="150" x2="30" y2="168"/>
      <line x1="26" y1="145" x2="40" y2="163"/>
    </g>
    <text x="120" y="112" text-anchor="middle" fill="var(--onAccent)"
          font-family="Caveat, cursive" font-size="46" letter-spacing="3" id="initials"></text>
  </svg>
</div>

<div class="yay" id="yay">
  <canvas id="pop"></canvas>
  <div class="in">
    <h2>YAY</h2>
    <p id="yayline"></p>
    <div class="pick">pick your night</div>
    <div class="days" id="days"></div>
    <div class="locked" id="locked"></div>
    <button class="close" id="close" type="button">back to the invite</button>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const state = INVITES.map(()=>({ said:false, day:null, used:false }));
  let active = 0;

  $("initials").textContent = INITIALS;

  /* tabs */
  const tabsEl = $("tabs");
  function drawTabs(){
    if(INVITES.length < 2){ tabsEl.classList.add("hide"); return; }
    tabsEl.classList.remove("hide");
    tabsEl.innerHTML = INVITES.map((v,i) =>
      '<button class="tab'+(i===active?' on':'')+'" type="button" data-i="'+i+'">'+v.tab+
      (state[i].said ? '<span class="yes">&#9825;</span>' : '')+'</button>').join("");
  }
  tabsEl.addEventListener("click", e=>{
    const b = e.target.closest(".tab"); if(!b) return;
    active = +b.dataset.i; drawTabs(); drawCard();
  });

  /* paint the active theme onto the page */
  function paint(){
    const t = INVITES[active].theme;
    const th = (t && typeof t === "object") ? Object.assign({}, THEMES.blush, t)
                                            : (THEMES[t] || THEMES.blush);
    const r = document.documentElement.style;
    Object.keys(th).forEach(k => { if(k !== "confetti") r.setProperty("--"+k, th[k]); });
    r.setProperty("--cpnBg", th.cpnBg || th.cardSolid);
    return th;
  }

  /* card */
  function drawCard(){
    paint();
    const v = INVITES[active], s = state[active];
    const rows = v.rows.filter(r=>r.v).map(r =>
      '<div class="row"><span class="k">'+r.k+'</span><span class="v">'+r.v+'</span></div>').join("");
    const ask = s.said
      ? '<div class="settled">you said yes'+(s.day ? ' &middot; '+s.day : '')+' &#9825;</div>'
      : '<div class="btns">'+
          '<button class="btn" id="yes" type="button">Yes</button>'+
          '<span class="slot"><button class="btn" id="no" type="button" aria-label="No, good luck">No</button></span>'+
        '</div><div class="taunt" id="taunt"></div>';

    const ph = v.photo
      ? '<div class="polaroid"><img src="'+v.photo.src+'" alt="us">'+
        (v.photo.caption ? '<div class="cap">'+v.photo.caption+'</div>' : '')+'</div>'
      : '';

    const c = v.coupon;
    const cpn = !c ? '' :
      '<div class="coupon'+(s.used?' used':'')+'">'+
        '<div class="cpn-main">'+
          '<div class="cpn-label">'+c.label+'</div>'+
          '<div class="cpn-title">'+c.title+'</div>'+
          '<div class="cpn-terms">'+c.terms+'</div>'+
          (s.used ? '<div class="cpn-terms" style="margin:0;color:var(--deep)">'+c.done+'</div>'
                  : '<button class="cpn-btn" id="redeem" type="button">'+c.cta+'</button>')+
        '</div>'+
        '<div class="cpn-stub"><div class="cpn-code">'+c.code+'</div>'+
          '<div class="cpn-exp">'+c.expires+'</div></div>'+
        (s.used ? '<div class="stamp"><span>REDEEMED</span></div>' : '')+
      '</div>';

    $("card").className = "card fade";
    $("card").innerHTML =
      '<div class="eyebrow">'+v.eyebrow+'</div>'+
      '<h1>'+v.title+'</h1>'+
      ph +
      '<p class="note">'+v.note+'</p>'+
      '<div class="rows">'+rows+'</div>'+
      cpn +
      '<p class="q">'+v.question+'</p>'+ ask;

    const rd = $("redeem");
    if(rd) rd.addEventListener("click", ()=>{ state[active].used = true; drawCard(); });

    if(!s.said) wireButtons();
  }

  /* the no button, which refuses to be caught */
  function wireButtons(){
    const no = $("no"), yes = $("yes"), taunt = $("taunt");
    let n = 0;
    function dodge(e){
      if(e) e.preventDefault();
      n++;
      const pad = 14, w = no.offsetWidth, h = no.offsetHeight;
      const x = pad + Math.random() * Math.max(1, innerWidth  - w - pad*2);
      const y = pad + Math.random() * Math.max(1, innerHeight - h - pad*2);
      no.style.position = "fixed";
      no.style.left = x+"px"; no.style.top = y+"px"; no.style.margin = "0";
      no.style.transform = "scale("+Math.max(.6, 1 - n*.05)+")";
      no.blur();
      yes.style.transform = "scale("+Math.min(1.28, 1 + n*.04)+")";
      taunt.textContent = TAUNTS[(n-1) % TAUNTS.length];
    }
    ["pointerenter","pointerdown","touchstart","mouseover","focus","click"].forEach(ev =>
      no.addEventListener(ev, dodge, {passive:false}));

    yes.addEventListener("click", ()=>{
      const v = INVITES[active];
      state[active].said = true;
      $("yayline").textContent = v.yayLine;
      $("days").innerHTML = (v.days||[]).map(d =>
        '<button class="day" type="button">'+d+'</button>').join("");
      $("locked").textContent = "";
      $("yay").classList.add("on");
      document.body.style.overflow = "hidden";
      if(!reduce) pop();
    });
  }

  /* pick a night */
  $("days").addEventListener("click", e=>{
    const b = e.target.closest(".day"); if(!b) return;
    [...$("days").children].forEach(c=>c.classList.remove("on"));
    b.classList.add("on");
    state[active].day = b.textContent;
    $("locked").textContent = b.textContent + " it is \u2661";
  });

  $("close").addEventListener("click", ()=>{
    $("yay").classList.remove("on");
    document.body.style.overflow = "";
    drawTabs(); drawCard();
  });

  /* confetti pop */
  function pop(){
    const cv = $("pop"), ctx = cv.getContext("2d");
    let W,H; const fit = ()=>{ W = cv.width = cv.offsetWidth; H = cv.height = cv.offsetHeight; };
    fit(); addEventListener("resize", fit);
    const cols = paint().confetti;
    const bits = Array.from({length:190}, ()=>{
      const a = Math.random()*Math.PI*2, s = 5 + Math.random()*15;
      return { x:W/2, y:H*0.42, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 4,
               w:7+Math.random()*11, h:5+Math.random()*9, r:Math.random()*6, vr:-.2+Math.random()*.4,
               c:cols[Math.floor(Math.random()*cols.length)], heart:Math.random()<.28 };
    });
    (function frame(){
      ctx.clearRect(0,0,W,H);
      let alive = false;
      bits.forEach(b=>{
        b.vy += .34; b.vx *= .992; b.x += b.vx; b.y += b.vy; b.r += b.vr;
        if(b.y < H + 40) alive = true;
        ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r); ctx.fillStyle = b.c;
        if(b.heart){
          const s = b.w/10;
          ctx.beginPath();
          ctx.moveTo(0,3*s);
          ctx.bezierCurveTo(-6*s,-2*s,-3*s,-7*s,0,-3*s);
          ctx.bezierCurveTo(3*s,-7*s,6*s,-2*s,0,3*s);
          ctx.fill();
        } else ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
        ctx.restore();
      });
      if(alive) requestAnimationFrame(frame);
    })();
  }

  drawTabs(); drawCard();
})();
</script>
</body>
</html>
