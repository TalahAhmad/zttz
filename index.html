.r-f{ text-align:center; margin-top:8px; font-size:10.5px; }

/* the map */
.mapwrap{ background:linear-gradient(180deg, var(--pinkSoft), #F3F8F4); border:1px solid var(--hair2); border-radius:20px; padding:6px 4px; }
.map{ display:block; width:100%; height:auto; overflow:visible; }
.lake{ fill:rgba(47,107,79,.12); stroke:rgba(47,107,79,.25); stroke-width:1.5; }
.lake-t{ font-family:"Fraunces",Georgia,serif; font-style:italic; font-size:15px; fill:var(--accent); opacity:.6; }
.route{ fill:none; stroke:var(--accent); stroke-width:4; stroke-linecap:round; stroke-dasharray:2 10; }
.route.pinkr{ stroke:var(--pinkDeep); }
.route.faint{ stroke:var(--soft); opacity:.35; stroke-width:3; }
.pin{ cursor:pointer; outline:none; }
.pin-dot{ fill:#fff; stroke:var(--accent); stroke-width:4; transition:.2s; }
.pin-heart{ fill:var(--pink); stroke:var(--deep); stroke-width:1.6; }
.pin-t{ font-family:"Karla",sans-serif; font-weight:700; font-size:20px; fill:var(--ink); }
.pin.on .pin-dot{ fill:var(--pink); stroke:var(--deep); }
.pin.on .pin-t{ fill:var(--pinkDeep); }
.pin:focus-visible .pin-dot{ stroke:var(--pinkDeep); stroke-width:6; }
@media (max-width:560px){ .pin-t{ font-size:30px; } .lake-t{ font-size:22px; } .route{ stroke-width:5; } }
.pinnote{ margin:14px auto 0; max-width:480px; text-align:center; }
.pinnote b{ display:block; font-family:"Caveat",cursive; font-size:25px; color:var(--pinkDeep); line-height:1.1; }
.pinnote span{ color:var(--soft); }
.pinnote.pop{ animation:fadein .35s ease-out; }
.exhibit{ display:block; margin:26px auto 0; max-width:min(300px,82%); transform:rotate(2deg); }

/* prize */
.cpn-wrap{ position:relative; }
.cpn-wrap .coupon{ margin:0; }
.cpn-wrap.shut .coupon{ filter:blur(3px) grayscale(.4); opacity:.55; pointer-events:none; }
.cpn-veil{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:10px; }
.cpn-veil span{ font-family:"Caveat",cursive; font-size:24px; color:var(--deep); background:var(--card);
  border:1.5px dashed var(--pink); border-radius:999px; padding:6px 18px; }
.cpn-wrap.unlocked{ animation:boing .7s cubic-bezier(.2,1.5,.4,1); }
.cpn-btn:disabled{ opacity:.5; cursor:default; }

/* letter */
.letter{ position:relative; max-width:600px; margin:0 auto; padding:28px clamp(18px,5vw,40px) 34px;
  background:#FFFDFB; border:1px solid var(--hair2); border-radius:6px;
  box-shadow:0 20px 40px -28px var(--shadow);
  background-image:linear-gradient(90deg, transparent 30px, rgba(233,138,166,.35) 30px 31px, transparent 31px); }
.l-to{ font-family:"Caveat",cursive; font-size:28px; color:var(--pinkDeep); margin-bottom:8px; }
.letter p{ font-family:"Fraunces",Georgia,serif; font-size:16.5px; line-height:1.7; color:var(--ink); margin:0 0 14px; }
.l-sign{ font-family:"Caveat",cursive; font-size:30px; color:var(--accent); text-align:right; margin-top:6px; padding-right:30px; }

.collage .q{ text-align:center; margin-top:48px; font-size:clamp(26px,6vw,34px); color:var(--deep); }
.collage .btns, .collage .taunt, .collage .settled{ text-align:center; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>

<div class="shell">
  <nav class="tabs" id="tabs"></nav>

  <main class="card" id="card"></main>

  <svg class="heart" viewBox="0 0 240 200" aria-label="a heart with an arrow through it" role="img">
    <line x1="14" y1="152" x2="226" y2="48" stroke="var(--deep)" stroke-width="5" stroke-linecap="round"/>
    <path d="M120 176 C 42 120, 20 74, 50 46 C 74 24, 105 31, 120 55 C 135 31, 166 24, 190 46 C 220 74, 198 120, 120 176 Z"
          fill="var(--accent)" stroke="var(--deep)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M226 48 L 206 44 L 212 62 Z" fill="var(--deep)"/>
    <g stroke="var(--deep)" stroke-width="4" stroke-linecap="round">
      <line x1="16" y1="150" x2="30" y2="168"/>
      <line x1="26" y1="145" x2="40" y2="163"/>
    </g>
    <text x="120" y="112" text-anchor="middle" fill="var(--onAccent)"
          font-family="Caveat, cursive" font-size="46" letter-spacing="3" id="initials"></text>
  </svg>
</div>

<div class="yay" id="yay">
  <canvas id="pop"></canvas>
  <div class="in">
    <h2>YAY</h2>
    <p id="yayline"></p>
    <div class="pick" id="pickl">pick your night</div>
    <div class="days" id="days"></div>
    <div class="locked" id="locked"></div>
    <button class="close" id="close" type="button">back to the invite</button>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const state = INVITES.map(v=>({ said:false, day:null, used:false, found:[], flips:{}, pin:"indy" }));
  let active = Math.max(0, INVITES.findIndex(v => v.open));

  $("initials").textContent = INITIALS;

  /* tabs */
  const tabsEl = $("tabs");
  function drawTabs(){
    if(INVITES.length < 2){ tabsEl.classList.add("hide"); return; }
    tabsEl.classList.remove("hide");
    tabsEl.innerHTML = INVITES.map((v,i) =>
      '<button class="tab'+(i===active?' on':'')+'" type="button" data-i="'+i+'">'+v.tab+
      (state[i].said ? '<span class="yes">&#9825;</span>' : '')+'</button>').join("");
  }
  tabsEl.addEventListener("click", e=>{
    const b = e.target.closest(".tab"); if(!b) return;
    active = +b.dataset.i; drawTabs(); drawCard();
  });

  /* paint the active theme onto the page */
  function paint(){
    const t = INVITES[active].theme;
    const th = (t && typeof t === "object") ? Object.assign({}, THEMES.blush, t)
                                            : (THEMES[t] || THEMES.blush);
    const r = document.documentElement.style;
    Object.keys(th).forEach(k => { if(k !== "confetti") r.setProperty("--"+k, th[k]); });
    r.setProperty("--cpnBg", th.cpnBg || th.cardSolid);
    return th;
  }


  /* ══════════════ the collage tab (kind: "collage") ══════════════ */
  let tick = null;
  const MONST_SVG = function(fill){
    return '<svg viewBox="0 0 44 44" aria-hidden="true">'+
      '<path d="M11 12 L9 4 L16 9 Z M33 12 L35 4 L28 9 Z" fill="'+fill+'" stroke="var(--deep)" stroke-width="2" stroke-linejoin="round"/>'+
      '<path d="M8 38 C5 24 8 9 22 8 C36 9 39 24 36 38 L31.5 34 L27 38 L22 34 L17 38 L12.5 34 Z" fill="'+fill+'" stroke="var(--deep)" stroke-width="2.2" stroke-linejoin="round"/>'+
      '<circle cx="16" cy="20" r="4.2" fill="#fff" stroke="var(--deep)" stroke-width="1.6"/><circle cx="28" cy="20" r="4.2" fill="#fff" stroke="var(--deep)" stroke-width="1.6"/>'+
      '<circle cx="17" cy="21" r="1.9" fill="var(--deep)"/><circle cx="27" cy="21" r="1.9" fill="var(--deep)"/>'+
      '<path d="M17 28 Q22 32 27 28" fill="none" stroke="var(--deep)" stroke-width="2" stroke-linecap="round"/></svg>';
  };
  function monstBtn(i, s, extra){
    const got = s.found.indexOf(i) > -1;
    return '<button class="monst'+(got?' got':'')+' '+(extra||'')+'" type="button" data-m="'+i+'" aria-label="a hiding monst">'+
      MONST_SVG(i % 2 ? "var(--accent)" : "var(--pink)")+'</button>';
  }

  const NOTES = {
    ticket:
      '<div class="ticket"><div class="t-top">parking garage</div>'+
      '<div class="t-big">ADMIT TWO</div>'+
      '<div class="t-row"><span>visit</span><b>the first one</b></div>'+
      '<div class="t-row"><span>duration</span><b>2 hrs</b></div>'+
      '<div class="t-row"><span>activity</span><b>one (1) hug</b></div>'+
      '<div class="t-row"><span>fee</span><b>worth it</b></div></div>',
    names:
      '<div class="sticky"><b>things you call me:</b> monst, papa<br>'+
      '<b>things you want me to call you:</b> mommy<br>'+
      '<b>things i will call you:</b> monst<br><span>(nice try.)</span></div>',
    bday:
      '<div class="bcard"><div class="b-cake">🎂</div><div class="b-h">happy birthday!</div>'+
      '<div class="b-s">(again)</div><div class="b-days"><span>day 1 ✓</span><span>day 2 ✓</span></div></div>',
    rpm:
      '<div class="receipt"><div class="r-h">RPM STEAK</div><div class="r-s">chicago \u00b7 table for 2</div>'+
      '<div class="r-l"><span>1x</span><span>birthday girl</span></div>'+
      '<div class="r-l"><span>1x</span><span>steak dinner</span></div>'+
      '<div class="r-l"><span>1x</span><span>birthday, day one of two</span></div>'+
      '<div class="r-t"><span>total</span><span>worth every bite</span></div>'+
      '<div class="r-f">happy birthday, monst \u2661</div></div>'
  };

  function mapSVG(v, s){
    const P = p => ({ x: 40 + (p.lon + 95) * (620/22), y: 60 + (44 - p.lat) * 36 });
    const by = {}; v.places.forEach(p => by[p.id] = Object.assign({}, p, P(p)));
    const hub = v.places.find(p=>p.heart) || v.places[0];
    const H = by[hub.id];
    const curve = (a,b,bend) => {
      const mx = (a.x+b.x)/2, my = (a.y+b.y)/2 - bend;
      return 'M'+a.x.toFixed(1)+' '+a.y.toFixed(1)+' Q'+mx.toFixed(1)+' '+my.toFixed(1)+' '+b.x.toFixed(1)+' '+b.y.toFixed(1);
    };
    let routes = '';
    if(by.rock) routes += '<path class="route" d="'+curve(by.rock,H,-10)+'"/>';
    if(by.cant) routes += '<path class="route pinkr" d="'+curve(by.cant,H,-10)+'"/>';
    if(by.iowa && by.rock) routes += '<path class="route faint" d="'+curve(by.iowa,by.rock,26)+'"/>';
    if(by.cant && by.phil) routes += '<path class="route faint" d="'+curve(by.cant,by.phil,30)+'"/>';
    const lake = '<path class="lake" d="M262 0 C252 40 238 70 241 96 C243 116 250 134 259 142 C268 146 276 136 282 124 C288 104 291 80 290 50 C289 30 286 12 284 0 Z"/>'+
                 '<text class="lake-t" x="266" y="44" text-anchor="middle">lake</text>';
    const pins = v.places.map(p => {
      const q = by[p.id], on = s.pin === p.id;
      const below = p.id === 'indy' || p.id === 'phil' || p.id === 'iowa';
      const mark = p.heart
        ? '<path class="pin-heart" transform="translate('+q.x+' '+(q.y-2)+') scale(1.25)" d="M0 9 C-11 1 -11 -9 -4.5 -9 C-1.5 -9 0 -6 0 -4 C0 -6 1.5 -9 4.5 -9 C11 -9 11 1 0 9 Z"/>'
        : '<circle class="pin-dot" cx="'+q.x+'" cy="'+q.y+'" r="9"/>';
      return '<g class="pin'+(on?' on':'')+'" data-pin="'+p.id+'" tabindex="0" role="button" aria-label="'+p.name+'">'+
        '<circle cx="'+q.x+'" cy="'+q.y+'" r="26" fill="transparent"/>'+ mark +
        '<text class="pin-t" x="'+q.x+'" y="'+(below ? q.y+36 : q.y-18)+'" text-anchor="middle">'+p.name+'</text></g>';
    }).join('');
    return '<svg class="map" viewBox="-24 20 724 250" role="img" aria-label="map from rural Iowa to Philly, meeting in Indianapolis">'+
      lake + routes + pins + '</svg>';
  }

  function couponHTML(v, s){
    const c = v.coupon, h = v.hunt, got = s.found.length >= h.count;
    const body =
      '<div class="coupon'+(s.used?' used':'')+'">'+
        '<div class="cpn-main">'+
          '<div class="cpn-label">'+c.label+'</div>'+
          '<div class="cpn-title">'+c.title+'</div>'+
          '<div class="cpn-terms">'+c.terms+'</div>'+
          (s.used ? '<div class="cpn-terms" style="margin:0;color:var(--deep)">'+c.done+'</div>'
                  : '<button class="cpn-btn" id="redeem" type="button"'+(got?'':' disabled')+'>'+c.cta+'</button>')+
        '</div>'+
        '<div class="cpn-stub"><div class="cpn-code">'+c.code+'</div><div class="cpn-exp">'+c.expires+'</div></div>'+
        (s.used ? '<div class="stamp"><span>REDEEMED</span></div>' : '')+
      '</div>';
    return got ? '<div class="cpn-wrap open">'+body+'</div>'
               : '<div class="cpn-wrap shut">'+body+'<div class="cpn-veil"><span>find all '+h.count+' monsts to unlock</span></div></div>';
  }

  function huntHTML(v, s){
    const h = v.hunt, n = s.found.length;
    let pips = '';
    for(let i=0;i<h.count;i++) pips += '<span class="pip'+(i<n?' on':'')+'">'+MONST_SVG(i<n ? "var(--pink)" : "var(--hair)")+'</span>';
    return '<div class="pips">'+pips+'</div><p>'+(n >= h.count ? h.done : h.intro+' <b>'+n+' / '+h.count+'</b>')+'</p>';
  }

  function drawCollage(v, s, ask){
    const P = v.paper;
    const rec = v.record.map((r,i) =>
      '<article class="story reveal"><div class="when">'+r.when+'</div><h4>'+r.head+'</h4><p>'+r.body+'</p></article>').join('');

    const rots = [-3,2.5,-1.5,3,-2.5,1.5,-3.5,2,-1,3.5,-2,1,-3,2.5];
    const board = v.board.map((b,i) => {
      const r = rots[i % rots.length];
      if(b.note) return '<div class="item note-item" style="--r:'+r+'deg">'+NOTES[b.note]+'</div>';
      const fl = s.flips[i] ? ' flip' : '';
      return '<div class="item" style="--r:'+r+'deg"><button class="pol'+fl+'" type="button" data-f="'+i+'" aria-label="flip photo">'+
        '<span class="pol-in"><span class="face"><img src="'+PICS[b.pic]+'" alt="us" loading="lazy"><span class="cap tapme">\u2661</span></span>'+
        '<span class="back"><span>'+b.cap+'</span></span></span></button></div>';
    }).join('');

    const place = v.places.find(p => p.id === s.pin) || v.places[0];
    const L = v.letter;

    $("card").className = "card fade collage";
    $("card").innerHTML =
      '<header class="mast">'+ monstBtn(0, s, 'm-mast') +
        '<div class="mast-top"><span>'+P.edition+'</span><b>T-Z Meet-aversary</b><span>'+P.date+'</span></div>'+
        '<div class="rule"></div><div class="mast-name">'+P.name+'</div><div class="rule"></div>'+
        '<div class="eyebrow">'+v.eyebrow+'</div>'+
        '<h1>'+P.headline+'</h1><p class="dek">'+P.dek+'</p>'+
      '</header>'+

      '<section class="count" aria-label="time together">'+
        ['days','hours','min','sec'].map(k => '<div class="cbox"><b id="c-'+k+'">0</b><span>'+k+'</span></div>').join('')+
        '<div class="c-cap">together since sept 30, 2024</div></section>'+

      '<div class="hunt" id="hunt">'+huntHTML(v, s)+'</div>'+

      '<section class="sec"><h3 class="kicker"><span>The Record</span></h3><div class="record">'+rec+'</div></section>'+

      '<section class="sec"><h3 class="kicker"><span>The Board</span></h3><p class="hint">tap a photo to flip it</p>'+
        '<div class="board">'+board+ monstBtn(1, s, 'm-board') +'</div></section>'+

      '<section class="sec"><h3 class="kicker"><span>Meeting in the Middle</span></h3>'+
        '<p class="hint">a boy from Canton, a girl from Rockford. tap a pin.</p>'+
        '<div class="mapwrap">'+mapSVG(v, s)+'</div>'+
        '<div class="pinnote" id="pinnote"><b>'+place.name+'</b><span>'+place.note+'</span></div>'+
        '<div class="polaroid exhibit"><img src="'+PICS[v.mapExhibit.pic]+'" alt="a map with our photos on it"><div class="cap">'+v.mapExhibit.cap+'</div></div>'+
      '</section>'+

      '<section class="sec"><h3 class="kicker"><span>The Prize</span></h3><div id="cpnSlot">'+couponHTML(v, s)+'</div></section>'+

      '<section class="sec"><h3 class="kicker"><span>Author’s Reply</span></h3>'+
        '<div class="letter">'+ monstBtn(2, s, 'm-letter') +
          '<div class="l-to">'+L.to+'</div>'+ L.paras.map(p=>'<p>'+p+'</p>').join('') +
          '<div class="l-sign">'+L.sign+'</div></div></section>'+

      '<p class="q">'+v.question+'</p>'+ ask;

    /* counter */
    const start = new Date(v.since).getTime();
    const upd = () => {
      let d = Math.max(0, Math.floor((Date.now() - start)/1000));
      const set = (k,n) => { const el = $("c-"+k); if(el) el.textContent = n; };
      set("days", Math.floor(d/86400)); d %= 86400;
      set("hours", Math.floor(d/3600)); d %= 3600;
      set("min", Math.floor(d/60)); set("sec", d % 60);
    };
    upd(); tick = setInterval(upd, 1000);

    /* flips */
    $("card").querySelectorAll(".pol").forEach(b => b.addEventListener("click", ()=>{
      const i = +b.dataset.f; s.flips[i] = !s.flips[i]; b.classList.toggle("flip", s.flips[i]);
    }));

    /* pins */
    $("card").querySelectorAll(".pin").forEach(g => {
      const go = () => {
        s.pin = g.dataset.pin;
        const p = v.places.find(x => x.id === s.pin);
        $("card").querySelectorAll(".pin").forEach(x => x.classList.toggle("on", x === g));
        $("pinnote").innerHTML = '<b>'+p.name+'</b><span>'+p.note+'</span>';
        $("pinnote").classList.remove("pop"); void $("pinnote").offsetWidth; $("pinnote").classList.add("pop");
      };
      g.addEventListener("click", go);
      g.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
    });

    /* monst hunt */
    $("card").querySelectorAll(".monst").forEach(m => m.addEventListener("click", ()=>{
      const i = +m.dataset.m;
      if(s.found.indexOf(i) > -1) return;
      s.found.push(i);
      m.classList.add("got","boop");
      $("hunt").innerHTML = huntHTML(v, s);
      if(s.found.length >= v.hunt.count){
        $("cpnSlot").innerHTML = couponHTML(v, s);
        $("cpnSlot").firstChild.classList.add("unlocked");
        wireRedeem(v, s);
      }
    }));
    wireRedeem(v, s);

    /* gentle fade-in on the newspaper stories */
    const items = $("card").querySelectorAll(".reveal");
    if(reduce || !("IntersectionObserver" in window)) items.forEach(x=>x.classList.add("in"));
    else {
      const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold:.15 });
      items.forEach(x => io.observe(x));
    }
  }

  function wireRedeem(v, s){
    const rd = $("redeem");
    if(rd && !rd.disabled) rd.addEventListener("click", ()=>{
      s.used = true; $("cpnSlot").innerHTML = couponHTML(v, s);
    });
  }

  /* card */
  function drawCard(){
    paint();
    if(tick){ clearInterval(tick); tick = null; }
    const v = INVITES[active], s = state[active];
    document.body.classList.toggle("wide", v.kind === "collage");
    const rows = (v.rows||[]).filter(r=>r.v).map(r =>
      '<div class="row"><span class="k">'+r.k+'</span><span class="v">'+r.v+'</span></div>').join("");
    const ask = s.said
      ? '<div class="settled">you said yes'+(s.day ? ' &middot; '+s.day : '')+' &#9825;</div>'
      : '<div class="btns">'+
          '<button class="btn" id="yes" type="button">Yes</button>'+
          '<span class="slot"><button class="btn" id="no" type="button" aria-label="No, good luck">No</button></span>'+
        '</div><div class="taunt" id="taunt"></div>';

    if(v.kind === "collage"){
      drawCollage(v, s, ask);
      if(!s.said) wireButtons();
      return;
    }

    const ph = v.photo
      ? '<div class="polaroid"><img src="'+v.photo.src+'" alt="us">'+
        (v.photo.caption ? '<div class="cap">'+v.photo.caption+'</div>' : '')+'</div>'
      : '';

    const c = v.coupon;
    const cpn = !c ? '' :
      '<div class="coupon'+(s.used?' used':'')+'">'+
        '<div class="cpn-main">'+
          '<div class="cpn-label">'+c.label+'</div>'+
          '<div class="cpn-title">'+c.title+'</div>'+
          '<div class="cpn-terms">'+c.terms+'</div>'+
          (s.used ? '<div class="cpn-terms" style="margin:0;color:var(--deep)">'+c.done+'</div>'
                  : '<button class="cpn-btn" id="redeem" type="button">'+c.cta+'</button>')+
        '</div>'+
        '<div class="cpn-stub"><div class="cpn-code">'+c.code+'</div>'+
          '<div class="cpn-exp">'+c.expires+'</div></div>'+
        (s.used ? '<div class="stamp"><span>REDEEMED</span></div>' : '')+
      '</div>';

    $("card").className = "card fade";
    $("card").innerHTML =
      '<div class="eyebrow">'+v.eyebrow+'</div>'+
      '<h1>'+v.title+'</h1>'+
      ph +
      '<p class="note">'+v.note+'</p>'+
      '<div class="rows">'+rows+'</div>'+
      cpn +
      '<p class="q">'+v.question+'</p>'+ ask;

    const rd = $("redeem");
    if(rd) rd.addEventListener("click", ()=>{ state[active].used = true; drawCard(); });

    if(!s.said) wireButtons();
  }

  /* the no button, which refuses to be caught */
  function wireButtons(){
    const no = $("no"), yes = $("yes"), taunt = $("taunt");
    let n = 0;
    function dodge(e){
      if(e) e.preventDefault();
      n++;
      const pad = 14, w = no.offsetWidth, h = no.offsetHeight;
      const x = pad + Math.random() * Math.max(1, innerWidth  - w - pad*2);
      const y = pad + Math.random() * Math.max(1, innerHeight - h - pad*2);
      no.style.position = "fixed";
      no.style.left = x+"px"; no.style.top = y+"px"; no.style.margin = "0";
      no.style.transform = "scale("+Math.max(.6, 1 - n*.05)+")";
      no.blur();
      yes.style.transform = "scale("+Math.min(1.28, 1 + n*.04)+")";
      taunt.textContent = TAUNTS[(n-1) % TAUNTS.length];
    }
    ["pointerenter","pointerdown","touchstart","mouseover","focus","click"].forEach(ev =>
      no.addEventListener(ev, dodge, {passive:false}));

    yes.addEventListener("click", ()=>{
      const v = INVITES[active];
      state[active].said = true;
      $("yayline").textContent = v.yayLine;
      $("days").innerHTML = (v.days||[]).map(d =>
        '<button class="day" type="button">'+d+'</button>').join("");
      $("locked").textContent = "";
      $("pickl").textContent = v.pickLabel || "pick your night";
      $("close").textContent = v.closeLabel || "back to the invite";
      $("yay").classList.add("on");
      document.body.style.overflow = "hidden";
      if(!reduce) pop();
    });
  }

  /* pick a night */
  $("days").addEventListener("click", e=>{
    const b = e.target.closest(".day"); if(!b) return;
    [...$("days").children].forEach(c=>c.classList.remove("on"));
    b.classList.add("on");
    state[active].day = b.textContent;
    $("locked").textContent = b.textContent + " it is \u2661";
  });

  $("close").addEventListener("click", ()=>{
    $("yay").classList.remove("on");
    document.body.style.overflow = "";
    drawTabs(); drawCard();
  });

  /* confetti pop */
  function pop(){
    const cv = $("pop"), ctx = cv.getContext("2d");
    let W,H; const fit = ()=>{ W = cv.width = cv.offsetWidth; H = cv.height = cv.offsetHeight; };
    fit(); addEventListener("resize", fit);
    const cols = paint().confetti;
    const bits = Array.from({length:190}, ()=>{
      const a = Math.random()*Math.PI*2, s = 5 + Math.random()*15;
      return { x:W/2, y:H*0.42, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 4,
               w:7+Math.random()*11, h:5+Math.random()*9, r:Math.random()*6, vr:-.2+Math.random()*.4,
               c:cols[Math.floor(Math.random()*cols.length)], heart:Math.random()<.28 };
    });
    (function frame(){
      ctx.clearRect(0,0,W,H);
      let alive = false;
      bits.forEach(b=>{
        b.vy += .34; b.vx *= .992; b.x += b.vx; b.y += b.vy; b.r += b.vr;
        if(b.y < H + 40) alive = true;
        ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r); ctx.fillStyle = b.c;
        if(b.heart){
          const s = b.w/10;
          ctx.beginPath();
          ctx.moveTo(0,3*s);
          ctx.bezierCurveTo(-6*s,-2*s,-3*s,-7*s,0,-3*s);
          ctx.bezierCurveTo(3*s,-7*s,6*s,-2*s,0,3*s);
          ctx.fill();
        } else ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
        ctx.restore();
      });
      if(alive) requestAnimationFrame(frame);
    })();
  }

  drawTabs(); drawCard();
})();
</script>
</body>
</html>
